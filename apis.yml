apis:
- aid: advisorcheck:advisorcheck-platform-api
  name: AdvisorCheck Platform API
  description: 'The first-party HTTP API behind the AdvisorCheck consumer web application, served from
    an AWS API Gateway custom domain at api.advisorcheck.com. It is an internal application backend, not
    a published developer product: every route answers HTTP 403 "Missing Authentication Token" without
    an app-issued credential, /ping returns 200 "healthy", and the /fa/* prefix proxies to an upstream
    fa-service at /v1/fa-service/*. AdvisorCheck publishes no OpenAPI, GraphQL SDL, Postman collection,
    API reference or developer portal for it — see x-coverage.'
